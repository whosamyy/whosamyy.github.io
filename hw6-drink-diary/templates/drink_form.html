{% extends 'base.html' %}
{% block content %}
<section class="form-panel">
  <h1>{{ 'Edit Drink' if editing else 'Add a Drink' }}</h1>
  <p>A new sip for the diary. Fields marked * are required.</p>
  <form method="post" class="drink-form">
    <label>Shop *<input name="shop" value="{{ drink.shop or '' }}" required></label>
    <label>Drink name *<input name="drink_name" value="{{ drink.drink_name or '' }}" required></label>
    <label>Category *<select name="category" required><option value="">Choose a category</option>{% for category in categories %}<option {% if drink.category == category %}selected{% endif %}>{{ category }}</option>{% endfor %}</select></label>
    <label>Sugar level<input name="sugar_level" value="{{ drink.sugar_level or '' }}" placeholder="e.g. 50%"></label>
    <label>Ice level<input name="ice_level" value="{{ drink.ice_level or '' }}" placeholder="e.g. Less ice"></label>
    <label>Rating (1–10) *<input type="number" name="rating" min="1" max="10" step="1" value="{{ drink.rating or '' }}" required></label>
    <label>Date<input type="date" name="date" value="{{ drink.date or '' }}"></label>
    <label class="full">Notes<textarea name="notes" rows="4" placeholder="What did you think?">{{ drink.notes or '' }}</textarea></label>
    <div class="actions full"><button type="submit">{{ 'Save Changes' if editing else 'Add Drink' }}</button><a href="{{ url_for('index') }}">Cancel</a></div>
  </form>
</section>
{% endblock %}
