<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amy's Drink Diary</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('index') }}">Amy's Drink Diary 🧋</a>
    <p>because apparently I need a database for my matcha opinions</p>
    <nav aria-label="Main navigation"><a href="{{ url_for('index') }}">My diary</a><a class="button" href="{{ url_for('add_drink') }}">+ Add a Drink</a></nav>
  </header>
  <main>
    {% if errors %}<div class="errors" role="alert"><ul>{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul></div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer>A little sip, a little review, a lot of opinions.</footer>
</body>
</html>
