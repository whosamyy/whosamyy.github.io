<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Find recipes from ingredients already in your kitchen.">
    <title>Recipe Finder | Amy Hu</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header class="site-header"><a class="brand" href="../">Amy Hu <span>✦ Recipe Finder</span></a></header>
    <main>
        <section class="hero">
            <div class="hero-copy">
                <p class="eyebrow">MAKE MORE WITH WHAT YOU HAVE</p>
                <h1>What's in your kitchen?</h1>
                <p>Enter what you have and find something to cook.</p>
                <div class="ingredient-entry">
                    <label class="sr-only" for="ingredient-input">Add an ingredient</label>
                    <input id="ingredient-input" type="text" placeholder="Try chicken, rice, or garlic" autocomplete="off">
                    <button id="add-ingredient" class="secondary" type="button">Add ingredient</button>
                </div>
                <div id="ingredient-chips" class="chips" aria-live="polite"></div>
                <div class="hero-actions">
                    <button id="find-recipes" class="primary" type="button">Find recipes</button>
                    <button id="surprise-me" class="secondary" type="button" disabled>Surprise me ✨</button>
                    <button id="clear-all" class="text-button" type="button">Clear all</button>
                </div>
                <p id="input-message" class="input-message" aria-live="polite"></p>
            </div>
            <img class="hero-image" src="https://images.unsplash.com/photo-1540189549336-e6e99c3679fe?auto=format&amp;fit=crop&amp;w=1000&amp;q=80" alt="Colorful fresh ingredients in bowls">
        </section>

        <section class="controls" aria-label="Recipe controls">
            <div><label for="sort">Sort by</label><select id="sort"><option value="match">Best ingredient match</option><option value="time">Shortest total time</option><option value="rating">Highest rating</option></select></div>
            <div><label for="cuisine">Cuisine</label><select id="cuisine"><option value="">Any cuisine</option></select></div>
            <div><label for="difficulty">Difficulty</label><select id="difficulty"><option value="">Any difficulty</option></select></div>
            <div><label for="meal-type">Meal type</label><select id="meal-type"><option value="">Any meal</option></select></div>
            <div><label for="max-time">Maximum total time</label><select id="max-time"><option value="">Any time</option><option value="30">30 minutes</option><option value="45">45 minutes</option><option value="60">1 hour</option></select></div>
            <label class="favorite-toggle"><input id="favorites-only" type="checkbox"> <span>♥ Saved only</span></label>
        </section>

        <section class="results-section" aria-labelledby="results-title">
            <div class="results-heading"><div><p class="eyebrow">YOUR OPTIONS</p><h2 id="results-title">Recipes to try</h2></div><p id="result-count" aria-live="polite"></p></div>
            <div id="status" class="status" role="status">Loading recipes from the public API…</div>
            <div id="recipe-grid" class="recipe-grid"></div>
        </section>
    </main>
    <dialog id="recipe-modal" aria-labelledby="modal-title"><button id="close-modal" class="close" type="button" aria-label="Close recipe details">×</button><div id="modal-content"></div></dialog>
    <footer>Built with the public DummyJSON Recipes API · <a href="../">Back to portfolio</a></footer>
</body>
</html>
