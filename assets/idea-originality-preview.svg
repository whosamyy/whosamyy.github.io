<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
  <title>Miniature How Original Is My Idea application</title>
  <desc>A cream and dusty-rose app window with an idea input, Analyze My Idea button, and a small competitive-landscape result for Cowlar.</desc>
  <rect width="600" height="200" fill="#f3e3df"/>
  <!-- A substantial app window keeps the preview legible at portfolio-card size. -->
  <rect x="73" y="16" width="462" height="178" rx="10" fill="#d5b9c7"/>
  <rect x="68" y="11" width="462" height="178" rx="10" fill="#fffaf3" stroke="#b88da3" stroke-width="2"/>
  <path d="M78 12h442a9 9 0 0 1 9 9v12H69V21a9 9 0 0 1 9-9z" fill="#dfb6c8"/>
  <g fill="#fffaf3" shape-rendering="crispEdges"><path d="M81 20h5v5h-5zM91 20h5v5h-5zM101 20h5v5h-5z"/></g>
  <text x="510" y="25" text-anchor="end" font-family="Arial, sans-serif" font-size="9" fill="#674354">idea, meet world.</text>
  <text x="300" y="61" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="23" fill="#563848">How Original Is My Idea? <tspan fill="#96546b">✦</tspan></text>
  <!-- The input and action mirror the actual landing-page interaction. -->
  <text x="96" y="80" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#674354">Your next big idea</text>
  <rect x="94" y="86" width="232" height="48" rx="7" fill="#ffffff" stroke="#cdb8c4"/>
  <text x="105" y="105" font-family="Arial, sans-serif" font-size="11" fill="#715b67">A wearable that monitors</text>
  <text x="105" y="121" font-family="Arial, sans-serif" font-size="11" fill="#715b67">livestock health…</text>
  <rect x="94" y="142" width="232" height="29" rx="8" fill="#96546b"/>
  <text x="210" y="161" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#ffffff">Analyze My Idea ✦</text>
  <!-- Miniature landscape report: a real semantic example, not a score. -->
  <rect x="339" y="76" width="168" height="95" rx="8" fill="#f3e1e9" stroke="#d4b3c4"/>
  <text x="351" y="92" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#84516b">CLOSEST KNOWN ANALOG</text>
  <text x="351" y="115" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#563848">Cowlar</text>
  <text x="351" y="130" font-family="Arial, sans-serif" font-size="10" fill="#715b67">Health monitoring for cows</text>
  <rect x="351" y="139" width="76" height="19" rx="7" fill="#e5ddef" stroke="#cec0df"/>
  <text x="389" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#665071">Agriculture</text>
  <rect x="434" y="139" width="60" height="19" rx="7" fill="#fffaf3" stroke="#dcc8d0"/>
  <text x="464" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#84516b">YC · W17</text>
  <text x="300" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#7a6370">A little idea. A whole neighborhood of possibilities.</text>
  <!-- Small pixel sparkles tie the UI illustration to the neighboring previews. -->
  <g fill="#b88da3" shape-rendering="crispEdges"><path d="M39 49h4v16h-4zM33 55h16v4H33zM553 126h4v16h-4zM547 132h16v4h-16z"/></g>
  <g fill="#fffaf3" shape-rendering="crispEdges"><path d="M548 47h4v12h-4zM544 51h12v4h-12zM43 151h4v12h-4zM39 155h12v4H39z"/></g>
</svg>
