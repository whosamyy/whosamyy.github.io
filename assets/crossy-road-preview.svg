  <!-- Blocky chicken waiting on the grass. -->
  <g transform="translate(289 88)">
    <rect x="-5" y="28" width="39" height="8" fill="#b3ca9f"/>
    <path d="M6 28h6v8H6zM21 28h6v8h-6z" fill="#e4a14f"/>
