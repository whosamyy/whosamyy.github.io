  </g>
  <!-- Lavender car traveling in the other lane. -->
  <g transform="translate(398 141)">
    <path d="M9-4h12v6H9zM9 32h12v6H9zM48-4h12v6H48zM48 32h12v6H48z" fill="#382d3d"/>
    <rect width="68" height="33" fill="#aaa0cb"/>
    <path d="M21 4h30v25H21z" fill="#d3cbea"/>
    <path d="M17 5h9v23h-9zM47 5h8v23h-8z" fill="#685d79"/>
    <path d="M0 3h5v6H0zM0 24h5v6H0z" fill="#fff1cd"/>
