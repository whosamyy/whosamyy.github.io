  <path d="M0 27h600M0 81h600M0 137h600M0 179h600" stroke="#8e7b8c" stroke-width="3"/>
  <path d="M0 54h600M0 158h600" stroke="#f7e9cf" stroke-width="3" stroke-dasharray="23 20"/>
  <!-- Grass and flowers. -->
  <path d="M28 101h6v8h-6zM39 106h6v8h-6zM193 115h6v8h-6zM420 100h6v8h-6zM430 105h6v8h-6zM552 189h6v8h-6zM98 7h6v8h-6z" fill="#a6c28f"/>
  <path d="M143 99h7v7h-7zM459 119h7v7h-7zM523 7h7v7h-7z" fill="#e69bb9"/>
  <!-- Pink car. -->
  <g transform="translate(102 34)">
    <path d="M8-4h13v7H8zM8 33h13v7H8zM50-4h13v7H50zM50 33h13v7H50z" fill="#382d3d"/>
    <rect width="72" height="36" fill="#d879a3"/>
