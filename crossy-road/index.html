<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crossy Road</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <!-- ══════════════════════════════════════════
         START SCREEN  — shown before game begins
    ══════════════════════════════════════════ -->
    <div id="startScreen" class="overlay">
      <div class="overlay-box">
        <div class="chicken-logo">🐔</div>
        <h1>Crossy Road</h1>
        <p class="tagline">How far can you go?</p>

        <div class="instructions">
          <p><strong>Move:</strong> Arrow Keys or WASD</p>
          <p><strong>Avoid:</strong> Cars &amp; trucks</p>
          <p><strong>Cross</strong> roads to score points</p>
          <p><strong>Logs</strong> keep you above water</p>
        </div>

        <button id="startBtn" class="big-btn">▶ Start Game</button>

        <p class="hint">Press <kbd>Space</kbd> or <kbd>Enter</kbd> to start</p>
      </div>
    </div>

    <!-- ══════════════════════════════════════════
         GAME OVER OVERLAY  — shown when you die
    ══════════════════════════════════════════ -->
    <div id="gameOverScreen" class="overlay hidden">
      <div class="overlay-box">
        <div class="dead-chicken">💀</div>
        <h2>Game Over</h2>
        <p class="go-score">Score: <span id="finalScore">0</span></p>
        <p class="go-best">Best:&nbsp;&nbsp;<span id="finalBest">0</span></p>
        <button id="restartBtn" class="big-btn">↩ Play Again</button>
        <p class="hint">Press <kbd>R</kbd>, <kbd>Space</kbd>, or <kbd>Enter</kbd></p>
      </div>
    </div>

    <!-- ══════════════════════════════════════════
         GAME WRAPPER  — HUD + canvas
    ══════════════════════════════════════════ -->
    <div id="gameWrapper" class="hidden">

      <!-- top HUD bar -->
      <div id="hud">
        <span id="hudScore">Score: 0</span>
        <span id="hudTitle">🐔 Crossy Road</span>
        <span id="hudBest">Best: 0</span>
      </div>

      <!-- the canvas — all game graphics are drawn here -->
      <canvas id="gameCanvas" width="600" height="600"></canvas>

    </div>

    <!-- game.js is loaded last so every HTML element above already exists -->
    <script src="game.js"></script>

  </body>
</html>
