<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossy Road</title>
    <link rel="stylesheet" href="style.css">
    <script src="game.js" defer></script>
</head>
<body>
    <main>
        <h1>Crossy Road</h1>
        <p id="controls">Move one space with the arrow keys or W, A, S, D. Avoid the cars!</p>
        <p>Score: <span id="score">0</span></p>
        <div id="game-container" role="img" aria-label="Crossy Road board with a pink player and moving cars" aria-describedby="controls"></div>
        <p id="game-status" role="status"></p>
        <button id="restart-button" type="button">Restart</button>
    </main>
</body>
</html>
